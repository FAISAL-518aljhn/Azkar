<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>أذكار الصباح والمساء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2E9;--surface:#fff;--ink:#1B241F;--muted:#6B6F66;--line:#E4DDCB;--brand:#1F4D3A;--brand-ink:#F5E9C6;--gold:#8F6A20;--tint:#F3EBD6;--done:#E3EFE7;--ring:#1F4D3A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:only light}

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);padding:14px 16px 12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.wrap{max-width:560px;margin:0 auto}
h1{margin:0;font-family:'Amiri',serif;font-size:26px;font-weight:700;text-align:center;line-height:1.3}
.tabs{display:flex;gap:6px;margin:10px 0 10px;background:rgba(0,0,0,.2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--brand-ink);font:500 16px 'Tajawal',sans-serif;padding:8px;border-radius:9px;cursor:pointer;opacity:.8}
.tabs button[aria-selected="true"]{background:var(--brand-ink);color:#1F4D3A;opacity:1;font-weight:700}
.sum{display:flex;align-items:center;gap:10px;font-size:14px}
.bar{flex:1;height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#D9BF7C;border-radius:5px;transition:width .3s}
.rst{background:none;border:1px solid rgba(245,233,198,.4);color:var(--brand-ink);border-radius:8px;font:13px 'Tajawal',sans-serif;padding:2px 10px;cursor:pointer}
main{padding:16px 14px 40px}
.done-msg{background:var(--done);border:1px solid var(--ring);border-radius:14px;padding:14px;text-align:center;font-family:'Amiri',serif;font-size:21px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:background .25s,border-color .25s}
.card.ok{background:var(--done);border-color:var(--ring)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.no{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.top h2{margin:0;font-size:17px;font-weight:700;flex:1}
.tag{font-size:12px;background:var(--tint);color:var(--gold);padding:1px 10px;border-radius:10px;font-weight:700}
.txt{font-family:'Amiri','Traditional Arabic',serif;font-size:23px;line-height:2.15;white-space:pre-line;text-align:center;padding:6px 0 10px}
.fadl{background:var(--tint);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink)}
.fadl b{color:var(--gold)}
.fadl em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:3px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.tap{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-family:'Tajawal',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(31,77,58,.35);transition:transform .08s}
.tap:active{transform:scale(.93)}
.tap b{font-size:32px;line-height:1.1}.tap small{font-size:13px;opacity:.85}
.tap.one{width:auto;height:48px;border-radius:24px;padding:0 28px;flex-direction:row;font-size:17px;font-weight:700}
.card.ok .tap{background:var(--ring);color:#fff;box-shadow:none}
.tap.big{width:min(100%,300px);height:120px;border-radius:30px}.tap.big b{font-size:46px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}.dots i{width:22px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;display:block}.dots s{position:absolute;inset:0;background:var(--ring);transform-origin:right;transform:scaleX(0);transition:transform .15s;display:block}
.ten{background:none;border:1px solid var(--line);color:var(--muted);border-radius:19px;height:38px;padding:0 12px;font:500 14px 'Tajawal',sans-serif;cursor:pointer}
.undo{background:none;border:1px solid var(--line);color:var(--muted);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.foot{text-align:center;font-family:'Amiri',serif;font-size:20px;color:var(--gold);margin-top:22px}
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#ov[hidden],.om[hidden]{display:none}
.ovc{max-width:560px;margin:0 auto;padding:16px 20px 30px;text-align:center}
.x{float:left;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;cursor:pointer}
.ot{font-family:'Amiri',serif;font-size:28px;font-weight:700;margin-top:6px}
.hrt{width:min(78vw,300px);margin:18px auto 6px;display:block;overflow:visible}
#hp{stroke:var(--ring);stroke-width:3;fill:#464646;transition:fill .4s}
#spots circle{fill:#000;transition:opacity .8s}
.oc{font:700 34px 'Tajawal',sans-serif}
.oa{font-family:'Amiri',serif;font-size:30px;margin:6px 0 14px}
.om{background:var(--done);border:1px solid var(--ring);border-radius:12px;padding:10px;margin-bottom:12px}
.oh{font-size:14px;color:var(--muted);background:var(--tint);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.oh em{display:block;font-style:normal;font-size:12.5px;margin-top:3px}
.go{border:0;background:var(--brand);color:var(--brand-ink);font:700 20px 'Tajawal',sans-serif;padding:14px 44px;border-radius:30px;cursor:pointer}
.spd{margin-top:16px;color:var(--muted);font-size:14px}.spd button{margin:0 4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:3px 12px;font:14px 'Tajawal',sans-serif;cursor:pointer}.spd .on{background:var(--brand);color:var(--brand-ink)}
.auto{display:block;width:100%;margin-top:12px;border:1px solid var(--ring);background:none;color:var(--ring);font:700 16px 'Tajawal',sans-serif;padding:10px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap">
<h1>أذكار الصباح والمساء</h1>
<div class="tabs" role="tablist"><button role="tab" id="tm" aria-selected="true">أذكار الصباح</button><button role="tab" id="te" aria-selected="false">أذكار المساء</button></div>
<div class="sum"><span id="cnt"></span><div class="bar"><i id="pg"></i></div><button class="rst" id="rst">إعادة</button></div>
</div></header>
<main><div class="wrap" id="list"></div></main>
<div id="ov" hidden><div class="ovc">
<button class="x" id="cl" aria-label="إغلاق">×</button>

<svg viewBox="0 0 200 180" class="hrt" aria-hidden="true"><defs><clipPath id="hc"><path d="M100 170C20 110 0 60 40 30C70 8 100 30 100 45C100 30 130 8 160 30C200 60 180 110 100 170Z"/></clipPath></defs><g id="hs" style="transform-box:fill-box;transform-origin:center"><path id="hp" d="M100 170C20 110 0 60 40 30C70 8 100 30 100 45C100 30 130 8 160 30C200 60 180 110 100 170Z"/><g id="spots" clip-path="url(#hc)"></g></g></svg>
<div class="oc" id="oc"></div>
<div class="oa">أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ</div>

<div class="oh">«إن المؤمن إذا أذنب كانت نكتة سوداء في قلبه، فإن تاب ونزع واستغفر صُقل قلبه»<em>رواه الترمذي وابن ماجه</em></div>
<button class="go" id="go"></button>
<div class="spd" id="spd">السرعة: <button data-s="1000">١ ث</button><button data-s="2000" class="on">٢ ث</button><button data-s="3000">٣ ث</button></div>
</div></div>
<script>
var D=[
{h:"آية الكرسي",n:1,t:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",f:"من قرأها حين يصبح أُجير من الجن حتى يمسي، ومن قرأها حين يمسي أُجير منهم حتى يصبح.",s:"رواه الحاكم وصححه الألباني"},
{h:"الإخلاص والمعوذتان",n:3,t:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",f:"قال النبي ﷺ في قراءتها ثلاث مرات حين تمسي وحين تصبح: «تكفيك من كل شيء».",s:"رواه أبو داود والترمذي"},
{h:"أصبحنا وأصبح الملك لله",n:1,t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",x:[["أَصْبَحْنَا","أَمْسَيْنَا"],["أَصْبَحَ","أَمْسَى"],["هَذَا الْيَوْمِ","هَذِهِ اللَّيْلَةِ"],["مَا بَعْدَهُ","مَا بَعْدَهَا"]],l:"من السنة",f:"كان النبي ﷺ يقولها كل صباح، وكان يقول في المساء: «أمسينا وأمسى الملك لله…».",s:"رواه مسلم"},
{h:"اللهم بك أصبحنا",n:1,t:"اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ",x:[["بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا","بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا"],["النُّشُورُ","الْمَصِيرُ"]],l:"من السنة",f:"كان النبي ﷺ يقولها إذا أصبح، وفي المساء يقول: «اللهم بك أمسينا وبك أصبحنا… وإليك المصير».",s:"رواه الترمذي"},
{h:"سيد الاستغفار",n:1,t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",f:"من قالها موقناً بها حين يمسي فمات من ليلته دخل الجنة، ومن قالها موقناً بها حين يصبح فمات من يومه دخل الجنة.",s:"رواه البخاري"},
{h:"الرضا بالله ربّاً",n:3,t:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",f:"من قالها ثلاثاً حين يصبح وثلاثاً حين يمسي كان حقاً على الله أن يرضيه يوم القيامة.",s:"رواه أبو داود"},
{h:"بسم الله الذي لا يضر مع اسمه شيء",n:3,t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",f:"من قالها ثلاث مرات حين يصبح وثلاث مرات حين يمسي لم يضره شيء بإذن الله.",s:"رواه أبو داود والترمذي"},
{h:"دعاء العافية",n:3,t:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ\nاللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",l:"من السنة",f:"دعاء كان النبي ﷺ يدعو به صباحاً ومساءً، يسأل فيه ربه العافية في البدن والسمع والبصر.",s:"رواه أبو داود"},
{h:"حسبي الله",n:7,t:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",l:"المعنى",f:"تفويض الأمر لله والتوكل عليه، وهي من آخر سورة التوبة. وقد ورد عن أبي الدرداء رضي الله عنه أن من قالها سبعاً كفاه الله ما أهمّه.",s:"التوبة ١٢٩ · وأثر أبي الدرداء رواه أبو داود"},
{h:"سبحان الله وبحمده",a:1,n:100,t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",f:"من قال سبحان الله وبحمده مئة مرة حُطّت خطاياه وإن كانت مثل زبد البحر.",s:"متفق عليه"},
{h:"التهليل",a:1,n:100,t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",f:"من قالها في يوم مئة مرة كانت له عدل عشر رقاب، وكُتبت له مئة حسنة، ومُحيت عنه مئة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي.",s:"متفق عليه"},
{h:"الاستغفار",a:1,n:100,t:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",l:"من السنة",f:"قال النبي ﷺ: «إني لأستغفر الله في اليوم مئة مرة».",s:"رواه مسلم"},
{h:"الصلاة على النبي ﷺ",n:10,t:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",f:"من صلّى عليّ صلاة واحدة صلّى الله عليه بها عشراً.",s:"رواه مسلم"},
{h:"أعوذ بكلمات الله التامات",n:3,e:1,t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",f:"من قالها ثلاثاً حين يمسي لم تضره حُمَة تلك الليلة، أي لدغة كل ذات سمّ.",s:"رواه الترمذي وأحمد"}];
var tab=new Date().getHours()<15?'m':'e',K='azkar-v1',S={d:'',m:{},e:{}},day=new Date().toDateString();
try{var r=JSON.parse(localStorage.getItem(K));if(r&&r.d===day)S=r}catch(e){}S.d=day;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function ar(n){return String(n).replace(/\d/g,function(d){return'٠١٢٣٤٥٦٧٨٩'[d]})}
function dots(n,v){var h='<div class="dots">';for(var k=0;k<n/10;k++){var p=Math.min(Math.max(v-k*10,0),10)/10;h+='<i><s style="transform:scaleX('+p+')"></s></i>'}return h+'</div>'}
function items(){return D.map(function(o,i){return{o:o,i:i}}).filter(function(x){return tab==='e'||!x.o.e})}
function txt(o){return tab==='e'&&o.x?o.x.reduce(function(s,p){return s.split(p[0]).join(p[1])},o.t):o.t}
function render(){
var L=items(),c=S[tab],done=0,h='';
L.forEach(function(x,k){var o=x.o,v=c[x.i]||0,ok=v>=o.n;if(ok)done++;
h+='<section class="card'+(ok?' ok':'')+'"><div class="top"><span class="no">'+ar(k+1)+'</span><h2>'+o.h+'</h2>'+(o.e?'<span class="tag">مساءً فقط</span>':'')+'</div>'
+'<div class="txt">'+txt(o)+'</div>'
+'<div class="fadl"><b>'+(o.l||'الفضل')+':</b> '+o.f+'<em>'+o.s+'</em></div>'+(o.a?'<button class="auto" data-o="'+x.i+'">ابدأ مع القلب (يعدّ لك تلقائياً)</button>':'')
+'<div class="ctl">'+(o.n>1?'<button class="undo" data-u="'+x.i+'" aria-label="تراجع">−</button>':'')
+'<button class="tap'+(o.n===1?' one':o.n>=30?' big':'')+'" data-i="'+x.i+'">'+(o.n===1?(ok?'✓ تمّت القراءة':'تمّت القراءة'):'<b>'+(ok?'✓':ar(v))+'</b><small>'+(ok?'تمّ':'من '+ar(o.n))+'</small>')+'</button>'+(o.n>=30?'<button class="ten" dir="ltr" data-t="'+x.i+'">+١٠</button>':'')+'</div>'+(o.n>=30?dots(o.n,v):'')+'</section>'});
if(done===L.length)h='<div class="done-msg">ما شاء الله، أتممتَ أذكار '+(tab==='m'?'الصباح':'المساء')+'<br>تقبّل الله منك</div>'+h;
document.getElementById('list').innerHTML=h+'<div class="foot">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div>';
document.getElementById('cnt').textContent='أتممتَ '+ar(done)+' من '+ar(L.length);
document.getElementById('pg').style.width=(done/L.length*100)+'%';
document.getElementById('tm').setAttribute('aria-selected',tab==='m');document.getElementById('te').setAttribute('aria-selected',tab==='e')}
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
var wl=null;function keepOn(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}catch(e){}}
document.getElementById('list').addEventListener('click',function(e){
var t=e.target.closest('button');if(!t)return;var c=S[tab];
if(t.dataset.i!==undefined){var i=+t.dataset.i,n=D[i].n,v=c[i]||0;
if(n===1)c[i]=v?0:1;else if(v<n)c[i]=v+1;else return;
keepOn();buzz(c[i]>=n?[40,60,40,60,40]:(n>=30&&c[i]%10===0?[25,40,25]:10))}
else if(t.dataset.u!==undefined){var j=+t.dataset.u;c[j]=Math.max(0,(c[j]||0)-1)}
else if(t.dataset.t!==undefined){var m=+t.dataset.t;c[m]=Math.min(D[m].n,(c[m]||0)+10);keepOn();buzz(c[m]>=D[m].n?[40,60,40,60,40]:[25,40,25])}
else if(t.dataset.o!==undefined){openOv(+t.dataset.o);return}
else return;save();var y=window.scrollY;render();window.scrollTo(0,y)});
document.getElementById('tm').onclick=function(){tab='m';render();scrollTo(0,0)};
document.getElementById('te').onclick=function(){tab='e';render();scrollTo(0,0)};
document.getElementById('rst').onclick=function(){if(confirm('تبي تبدأ من الأول؟')){S[tab]={};save();render()}};
var OV={i:0,c:0,t:null,sp:2000,N:100};
function mkSpots(){var s=document.getElementById('spots'),seed=7,h='';function r(){seed=(seed*9301+49297)%233280;return seed/233280}for(var k=0;k<30;k++){h+='<circle cx="'+(25+r()*150).toFixed(1)+'" cy="'+(22+r()*120).toFixed(1)+'" r="'+(3+r()*8).toFixed(1)+'"/>'}s.innerHTML=h}
function paint(){var p=OV.c/OV.N,v=Math.round(70+185*p);document.getElementById('hp').style.fill='rgb('+v+','+v+','+v+')';var cs=document.querySelectorAll('#spots circle');for(var k=0;k<cs.length;k++)cs[k].style.opacity=OV.c>=(k+1)*OV.N/cs.length?0:1;document.getElementById('oc').textContent=ar(OV.c)+' / '+ar(OV.N)}
function setBtn(){document.getElementById('go').textContent=OV.c>=OV.N?'من جديد':OV.t?'إيقاف مؤقت':(OV.c?'أكمل':'ابدأ')}
function stopOv(){clearInterval(OV.t);OV.t=null;setBtn()}
function tick(){OV.c++;S[tab][OV.i]=OV.c;save();paint();buzz(12);try{document.getElementById('hs').animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:Math.min(OV.sp*.7,600)})}catch(e){}if(OV.c>=OV.N){stopOv();buzz([40,60,40,60,40]);document.getElementById('om').hidden=false}}
function goOv(){if(OV.c>=OV.N){OV.c=0;S[tab][OV.i]=0;save();paint();document.getElementById('om').hidden=true}if(OV.t){stopOv();return}keepOn();OV.t=setInterval(tick,OV.sp);setBtn()}
function openOv(i){OV.i=i;OV.N=D[i].n;OV.c=Math.min(S[tab][i]||0,OV.N);var ist=D[i].h==='الاستغفار';document.querySelector('.ot').textContent=D[i].h;var oa=document.querySelector('.oa');oa.textContent=D[i].t;oa.style.fontSize=D[i].t.length>40?'23px':'';document.querySelector('.oh').innerHTML=ist?'«إن المؤمن إذا أذنب كانت نكتة سوداء في قلبه، فإن تاب ونزع واستغفر صُقل قلبه»<em>رواه الترمذي وابن ماجه</em>':D[i].f+'<em>'+D[i].s+'</em>';document.getElementById('om').textContent=ist?'الحمد لله، أتممتَ الاستغفار. نسأل الله أن يغفر لنا ولك ويتقبّل منا.':'الحمد لله، أتممتَ «'+D[i].h+'». نسأل الله أن يتقبّل منا ومنك.';document.getElementById('om').hidden=OV.c<OV.N;document.getElementById('ov').hidden=false;if(!document.querySelector('#spots circle'))mkSpots();paint();setBtn()}
document.getElementById('go').onclick=goOv;
document.getElementById('cl').onclick=function(){stopOv();document.getElementById('ov').hidden=true;render()};
document.getElementById('spd').onclick=function(e){var b=e.target.closest('button');if(!b)return;OV.sp=+b.dataset.s;var a=this.querySelectorAll('button');for(var k=0;k<a.length;k++)a[k].className=a[k]===b?'on':'';if(OV.t){clearInterval(OV.t);OV.t=setInterval(tick,OV.sp)}};
document.addEventListener('visibilitychange',function(){if(document.hidden&&OV.t)stopOv()});
render();
</script>
</body>
</html>
